container: vllm-qwen
url: http://127.0.0.1:8000
model: Qwen/Qwen3.8-27B
idle_s: 30
off_s: 30
rest_max_c: 45
repeats: 3

runs:
  load:
    restart: true

  prefill:
    bench:
      random-output-len: 1
      num-prompts: 100
      max-concurrency: 1
      prompt-token-ids: true
      save-detailed: true
    sweep:
      random-input-len: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]

  decode:
    bench:
      random-input-len: 128
      random-output-len: 512
      ignore-eos: true
      prompt-token-ids: true
      save-detailed: true
    sweep:
      max-concurrency: [1, 2, 4, 8, 16, 32, 64]
      num-prompts: [25, 50, 100, 200, 400, 800, 1600]

  agentic:
    bench:
      backend: openai-chat
      random-input-len: 128
      random-output-len: 128
      num-prompts: 20
      max-concurrency: 1
      multi-turn: true
      multi-turn-num-turns: 8
      ignore-eos: true
      save-detailed: true
    sweep:
      random-prefix-len: [1024, 2048, 4096, 8192, 16384, 32768]
