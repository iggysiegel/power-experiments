[project]
name = "power-experiments"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "nvidia-ml-py>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_experiments"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear: likely mistakes
    "SIM",  # simplifiable code
    "RUF",  # ruff-specific
]

[tool.ruff.format]
docstring-code-format = true
